name: wisecondorX_env
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python>=3.11
  - scikit-learn
  - pysam
  - numpy
  - matplotlib
  - pandas
  - scipy
  - r-base
  - bioconductor-dnacopy
  - r-jsonlite
  - r-optparse
  - pip
  - pip:
    - typer

# stažení staré verze WisecondorX, kde je ještě Rko a funkční CBS, protože novější verze už CBS neobsahuje a Rko je potřeba pro funkci CBS
# PROBLÉM: CBS je potřeba pro vytvoření grafů - je možné, že v budoucnu bude stačit pouze Python (aktuálně na tom pracují)